<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe3ee">
  <title>Thiệp chúc mừng 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- nền -->
  <div class="bg" aria-hidden="true">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i>
  </div>

  <!-- hoa rơi -->
  <canvas id="petals" aria-hidden="true"></canvas>

  <main id="app">

    <!-- màn 1: phong bì -->
    <section id="stage" class="stage">
      <p class="pre">Một lá thư dành riêng cho</p>
      <h2 class="env-name" id="envName"></h2>

      <div class="envelope" id="envelope" role="button" tabindex="0" aria-label="Chạm để mở thiệp">
        <div class="env-back"></div>
        <div class="letter">
          <div class="letter-in">
            <span class="l-small">Thân gửi</span>
            <span class="l-name" id="letterName"></span>
            <span class="l-line"></span><span class="l-line short"></span>
          </div>
        </div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <radialGradient id="sg" cx="35%" cy="30%" r="80%">
                <stop offset="0" stop-color="#ffb3cf"/><stop offset="1" stop-color="#e0507f"/>
              </radialGradient>
            </defs>
            <path d="M50 86C16 62 8 42 14 27 20 12 41 11 50 27 59 11 80 12 86 27 92 42 84 62 50 86Z" fill="url(#sg)" stroke="#fff" stroke-width="4"/>
            <path d="M26 30q4-9 13-7" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".75"/>
          </svg>
        </div>
        <span class="pulse-ring"></span>
      </div>

      <p class="tap">Chạm vào phong bì để mở thiệp</p>
    </section>

    <!-- màn 2: thiệp -->
    <section id="cardStage" class="card-stage hidden">
      <article class="card">
        <img class="corner c-tl" alt="" aria-hidden="true">
        <img class="corner c-tr" alt="" aria-hidden="true">
        <img class="corner c-bl" alt="" aria-hidden="true">
        <img class="corner c-br" alt="" aria-hidden="true">

        <div class="badge">20 · 10</div>
        <h1 class="title">Chúc mừng ngày<br>Phụ nữ Việt Nam</h1>
        <p class="to">Gửi <span id="toName"></span></p>

        <div class="chips" aria-hidden="true">
          <span class="chip c1">xinh đẹp</span>
          <span class="chip c2">hạnh phúc</span>
          <span class="chip c3">thật nhiều hoa</span>
        </div>

        <div id="gallery" class="gallery"></div>

        <div class="wish-box"><p id="wish" class="wish"></p></div>

        <div class="note" id="noteBox">
          <div class="note-title">Nhắc nhỏ dành cho bạn</div>
          <p id="reminder" class="reminder"></p>
        </div>

        <div class="challenge hidden" id="challengeBox">
          <div class="challenge-title">Thử thách nhỏ</div>
          <p id="challenge" class="challenge-text"></p>
        </div>

        <p id="sign" class="sign"></p>
        <button id="replay" class="btn" type="button">Xem lại điều bất ngờ</button>

        <div class="stickers" id="stickers" aria-hidden="true"></div>
      </article>
    </section>

    <!-- lỗi / danh sách -->
    <section id="notFound" class="stage hidden">
      <div class="nf-card">
        <h2 id="nfTitle">Không tìm thấy thiệp</h2>
        <p id="nfText"></p>
        <ul id="nfList"></ul>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
